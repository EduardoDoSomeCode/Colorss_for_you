<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Artist Study Tool</title>

    <style>
        body {
            background: #1e1e1e;
            color: white;
            font-family: Arial;
            text-align: center;
        }

        .container {
            display: flex;
            justify-content: center;
            gap: 20px;
            flex-wrap: wrap;
        }

        canvas {
            border: 1px solid #444;
            max-width: 45%;
        }

        .controls {
            margin-top: 20px;
        }

        input[type="range"] {
            width: 250px;
        }

        button {
            margin-top: 10px;
            padding: 10px 20px;
            background: #444;
            color: white;
            border: none;
            cursor: pointer;
        }

        button:hover {
            background: #666;
        }
    </style>
</head>

<body>

    <h1>Artist Value & Sketch Tool</h1>

    <input type="file" id="upload" accept="image/*">

    <div class="controls">
        <p>Detail Level</p>
        <input type="range" id="detailSlider" min="2" max="15" value="10">

        <p>Contrast</p>
        <input type="range" id="contrastSlider" min="-100" max="100" value="0">


        <p>Line Threshold</p>
        <input type="range" id="thresholdSlider" min="0" max="255" value="120">

        <p>
            <input type="checkbox" id="removeBg">
            Remove White Background (Transparent)
        </p>

        <p>
            <input type="checkbox" id="edgeToggle">
            Enable Edge Detection (Sketch Mode)
        </p>


    </div>

    <button id="downloadBtn">Export Edited Image</button>

    <div class="container">
        <div>
            <h3>Original</h3>
            <canvas id="originalCanvas"></canvas>
        </div>
        <div>
            <h3>Edited</h3>
            <canvas id="editedCanvas"></canvas>
        </div>
    </div>

    <script>
        const upload = document.getElementById("upload");
        const originalCanvas = document.getElementById("originalCanvas");
        const editedCanvas = document.getElementById("editedCanvas");

        const octx = originalCanvas.getContext("2d");
        const ectx = editedCanvas.getContext("2d");

        const detailSlider = document.getElementById("detailSlider");
        const contrastSlider = document.getElementById("contrastSlider");
        const edgeToggle = document.getElementById("edgeToggle");
        const downloadBtn = document.getElementById("downloadBtn");
        const thresholdSlider = document.getElementById("thresholdSlider");
        const removeBg = document.getElementById("removeBg");

        thresholdSlider.oninput = applyEffects;
        removeBg.onchange = applyEffects;

        let img = new Image();

        upload.addEventListener("change", function (e) {
            const reader = new FileReader();
            reader.onload = function (event) {
                img.src = event.target.result;
            };
            reader.readAsDataURL(e.target.files[0]);
        });

        img.onload = function () {

            originalCanvas.width = editedCanvas.width = img.width;
            originalCanvas.height = editedCanvas.height = img.height;

            octx.drawImage(img, 0, 0);
            applyEffects();
        };

        detailSlider.oninput = applyEffects;
        contrastSlider.oninput = applyEffects;
        edgeToggle.onchange = applyEffects;

        function applyEffects() {

            ectx.drawImage(img, 0, 0);

            let imageData = ectx.getImageData(0, 0, editedCanvas.width, editedCanvas.height);
            let data = imageData.data;

            const levels = parseInt(detailSlider.value);
            const contrast = parseInt(contrastSlider.value);

            const contrastFactor = (259 * (contrast + 255)) / (255 * (259 - contrast));

            // ----- Grayscale + Contrast + Posterize -----
            for (let i = 0; i < data.length; i += 4) {

                let gray = 0.299 * data[i] + 0.587 * data[i + 1] + 0.114 * data[i + 2];

                // Apply contrast
                gray = contrastFactor * (gray - 128) + 128;

                // Posterization (detail control)
                let factor = 255 / levels;
                gray = Math.floor(gray / factor) * factor;

                data[i] = data[i + 1] = data[i + 2] = gray;
            }

            if (edgeToggle.checked) {
                imageData = sobelFilter(imageData);
            }

            ectx.putImageData(imageData, 0, 0);
        }

        function sobelFilter(imageData) {

            const width = imageData.width;
            const height = imageData.height;
            const src = imageData.data;
            const output = ectx.createImageData(width, height);
            const dst = output.data;

            const kernelX = [-1, 0, 1, -2, 0, 2, -1, 0, 1];
            const kernelY = [-1, -2, -1, 0, 0, 0, 1, 2, 1];

            for (let y = 1; y < height - 1; y++) {
                for (let x = 1; x < width - 1; x++) {

                    let gx = 0, gy = 0;
                    let i = 0;

                    for (let ky = -1; ky <= 1; ky++) {
                        for (let kx = -1; kx <= 1; kx++) {

                            let pixel = ((y + ky) * width + (x + kx)) * 4;
                            let val = src[pixel];

                            gx += val * kernelX[i];
                            gy += val * kernelY[i];
                            i++;
                        }
                    }

                    let magnitude = Math.sqrt(gx * gx + gy * gy);
                    let index = (y * width + x) * 4;

                    dst[index] = dst[index + 1] = dst[index + 2] = magnitude;
                    dst[index + 3] = 255;
                }
            }

            return output;
        }

        function sobelFilter(imageData) {

            const width = imageData.width;
            const height = imageData.height;
            const src = imageData.data;
            const output = ectx.createImageData(width, height);
            const dst = output.data;

            const kernelX = [-1, 0, 1, -2, 0, 2, -1, 0, 1];
            const kernelY = [-1, -2, -1, 0, 0, 0, 1, 2, 1];

            const threshold = parseInt(thresholdSlider.value);

            for (let y = 1; y < height - 1; y++) {
                for (let x = 1; x < width - 1; x++) {

                    let gx = 0, gy = 0;
                    let i = 0;

                    for (let ky = -1; ky <= 1; ky++) {
                        for (let kx = -1; kx <= 1; kx++) {

                            let pixel = ((y + ky) * width + (x + kx)) * 4;
                            let val = src[pixel];

                            gx += val * kernelX[i];
                            gy += val * kernelY[i];
                            i++;
                        }
                    }

                    let magnitude = Math.sqrt(gx * gx + gy * gy);

                    let index = (y * width + x) * 4;

                    // 🔥 Threshold to pure black/white
                    if (magnitude > threshold) {
                        dst[index] = 0;
                        dst[index + 1] = 0;
                        dst[index + 2] = 0;
                        dst[index + 3] = 255;
                    } else {

                        if (removeBg.checked) {
                            // Transparent background
                            dst[index] = 255;
                            dst[index + 1] = 255;
                            dst[index + 2] = 255;
                            dst[index + 3] = 0;
                        } else {
                            dst[index] = 255;
                            dst[index + 1] = 255;
                            dst[index + 2] = 255;
                            dst[index + 3] = 255;
                        }
                    }
                }
            }

            return output;
        }

        downloadBtn.addEventListener("click", function () {
            const link = document.createElement("a");
            link.download = "edited-image.png";
            link.href = editedCanvas.toDataURL();
            link.click();
        });

    </script>

</body>

</html>
