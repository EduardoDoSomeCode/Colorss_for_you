<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Generador de Gradientes</title>
    <link rel="stylesheet" href="styles.css">
</head>

<body>

    <div class="container">


        <nav>
            <a href="index.html">Color generation</a>
            <a href="image.html">Generate color from a image</a>

        </nav>
        <style>
            body {
                font-family: Arial, sans-serif;
                background: #1e1e1e;
                color: white;
                display: flex;
                justify-content: center;
                padding: 20px;
            }

            .container {
                width: 600px;
                background: #2c2c2c;
                padding: 20px;
                border-radius: 10px;
            }

            .controls label {
                display: block;
                margin-top: 10px;
            }

            input,
            select,
            button,
            textarea {
                width: 100%;
                margin-top: 5px;
                padding: 8px;
                border-radius: 5px;
                border: none;
            }

            #preview {
                height: 200px;
                margin-top: 20px;
                border-radius: 8px;
            }

            textarea {
                height: 60px;
                margin-top: 10px;
            }

            .buttons {
                display: flex;
                gap: 10px;
                margin-top: 10px;
            }

            button {
                cursor: pointer;
                background: #4CAF50;
                color: white;
            }

            .image-section {
                margin-top: 30px;
            }

            .image-preview-wrapper {
                display: flex;
                gap: 20px;
                margin-top: 15px;
            }

            .image-box {
                position: relative;
                width: 100%;
                height: 250px;
                background: #222;
                border-radius: 8px;
                overflow: hidden;
            }

            .image-box img {
                width: 100%;
                height: 100%;
                object-fit: cover;
            }

            .gradient-box {
                position: relative;
            }

            #gradientOverlay {
                position: absolute;
                inset: 0;
                pointer-events: none;
            }

            .drop-zone {
                border: 2px dashed #4CAF50;
                padding: 30px;
                text-align: center;
                border-radius: 8px;
                cursor: pointer;
                transition: 0.3s ease;
                background: #1a1a1a;
            }

            .drop-zone.dragover {
                background: #2e7d32;
                border-color: #81c784;
            }

            .drop-zone p {
                margin: 0;
                opacity: 0.8;
            }
        </style>
        <h1>🎨 Generador de Gradientes</h1>

        <div class="controls">
            <label>Tipo de Gradiente:</label>
            <select id="gradientType">
                <option value="linear">Linear</option>
                <option value="radial">Radial</option>
            </select>

            <label>Ángulo (solo linear):</label>
            <input type="number" id="angle" min="0" max="360" value="90">

            <label>Cantidad de Colores:</label>
            <input type="number" id="colorCount" min="2" max="6" value="2">

            <button id="generateColors">Generar Colores</button>
        </div>

        <label>Tipo de Armonía:</label>
        <select id="harmonyType">
            <option value="custom">Personalizado</option>
            <option value="mono">Monocromática</option>
            <option value="analogous">Análoga</option>
            <option value="complementary">Complementaria</option>
            <option value="triadic">Triádica</option>
        </select>

        <div id="colorInputs"></div>

        <div id="preview"></div>

        <!-- <textarea id="cssOutput" readonly></textarea> -->

        <div class="buttons">
            <!-- <button id="copyCSS">Copiar CSS</button> -->
            <button id="downloadImage">Exportar Imagen</button>
        </div>

    </div>
    <div class="image-section">

        <div class="image-controls">
            <label>Cargar Imagen:</label>
            <div id="dropZone" class="drop-zone">
                <p>Arrastra tu imagen aquí o haz clic</p>
                <input type="file" id="imageInput" accept="image/*" hidden>
            </div>
            <label>Opacidad del Gradiente:</label>
            <input type="range" id="overlayOpacity" min="0" max="1" step="0.1" value="0.5">

            <label>Modo de Mezcla:</label>
            <select id="blendMode">
                <option value="normal">Normal</option>
                <option value="multiply">Multiply</option>
                <option value="overlay">Overlay</option>
                <option value="screen">Screen</option>
                <option value="soft-light">Soft Light</option>
            </select>
        </div>

        <div class="image-preview-wrapper">
            <div class="image-box">
                <img id="originalImage">
            </div>

            <div class="image-box gradient-box">
                <img id="previewImage">
                <div id="gradientOverlay"></div>
            </div>
        </div>

    </div>

    <script>
        const gradientType = document.getElementById("gradientType");
        const angleInput = document.getElementById("angle");
        const colorCountInput = document.getElementById("colorCount");
        const generateColorsBtn = document.getElementById("generateColors");
        const colorInputsDiv = document.getElementById("colorInputs");
        const preview = document.getElementById("preview");
        const imageInput = document.getElementById("imageInput");
        const originalImage = document.getElementById("originalImage");
        const previewImage = document.getElementById("previewImage");
        const gradientOverlay = document.getElementById("gradientOverlay");
        const overlayOpacity = document.getElementById("overlayOpacity");
        const blendMode = document.getElementById("blendMode");

        // const cssOutput = document.getElementById("cssOutput");
        //const copyCSS = document.getElementById("copyCSS");
        const downloadImage = document.getElementById("downloadImage");
        const dropZone = document.getElementById("dropZone");
        function handleImage(file) {

            if (!file) return;

            // ✅ Validar tipo
            if (!file.type.startsWith("image/")) {
                alert("El archivo debe ser una imagen.");
                return;
            }

            // ✅ Validar tamaño (ej: 5MB máximo)
            if (file.size > 5 * 1024 * 1024) {
                alert("La imagen es demasiado grande (máx 5MB).");
                return;
            }

            const reader = new FileReader();

            reader.onload = function (event) {
                originalImage.src = event.target.result;
                previewImage.src = event.target.result;
            };

            reader.readAsDataURL(file);
        }

        // 🖱 Click abre selector
        dropZone.addEventListener("click", () => {
            imageInput.click();
        });

        // 🛑 Evitar comportamiento por defecto
        ["dragenter", "dragover", "dragleave", "drop"].forEach(eventName => {
            dropZone.addEventListener(eventName, e => e.preventDefault());
        });

        // 🎨 Efecto visual cuando arrastras
        dropZone.addEventListener("dragover", () => {
            dropZone.classList.add("dragover");
        });

        dropZone.addEventListener("dragleave", () => {
            dropZone.classList.remove("dragover");
        });

        // 📦 Cuando sueltas archivo
        dropZone.addEventListener("drop", (e) => {

            dropZone.classList.remove("dragover");

            const file = e.dataTransfer.files[0];

            handleImage(file);
        });

        // 📁 Cuando seleccionas manualmente
        imageInput.addEventListener("change", (e) => {
            const file = e.target.files[0];
            handleImage(file);
        });


        // 🎯 Generar inputs de colores dinámicamente
        generateColorsBtn.addEventListener("click", () => {
            const count = parseInt(colorCountInput.value);

            // ✅ Validación fuerte
            if (isNaN(count) || count < 2) {
                alert("Debe haber al menos 2 colores.");
                colorCountInput.value = 2;
                return;
            }

            colorInputsDiv.innerHTML = "";




            for (let i = 0; i < count; i++) {
                const input = document.createElement("input");
                input.type = "color";
                input.value = getRandomColor();

                // ✅ Listener directo seguro
                input.addEventListener("input", () => {
                    updateGradient();
                });

                colorInputsDiv.appendChild(input);
            }

            updateGradient();
        });

        // 🎯 Generar gradiente
        function updateGradient() {

            const colorInputs = colorInputsDiv.querySelectorAll("input");

            // ✅ Validación defensiva
            if (!colorInputs || colorInputs.length < 2) {
                preview.style.background = "#333";
                // cssOutput.value = "";
                return;
            }

            const colors = [...colorInputs].map(input => input.value);

            let gradient = "";

            if (gradientType.value === "linear") {

                let angle = parseInt(angleInput.value);

                // ✅ Si el ángulo está vacío o inválido
                if (isNaN(angle)) {
                    angle = 90;
                    angleInput.value = 90;
                }

                gradient = `linear-gradient(${angle}deg, ${colors.join(", ")})`;

            } else {

                gradient = `radial-gradient(circle, ${colors.join(", ")})`;
            }

            preview.style.background = gradient;
            // Aplicar gradiente al overlay si hay imagen
            gradientOverlay.style.background = gradient;
            gradientOverlay.style.opacity = overlayOpacity.value;
            gradientOverlay.style.mixBlendMode = blendMode.value;

            // cssOutput.value = `background: ${gradient};`;
        }
        overlayOpacity.addEventListener("input", () => {
            gradientOverlay.style.opacity = overlayOpacity.value;
        });

        blendMode.addEventListener("change", () => {
            gradientOverlay.style.mixBlendMode = blendMode.value;
        });


        // 🎯 Copiar CSS
        // copyCSS.addEventListener("click", () => {
        //     cssOutput.select();
        //     document.execCommand("copy");
        //     alert("CSS copiado!");
        // });

        // 🎯 Exportar como imagen
        downloadImage.addEventListener("click", () => {
            const canvas = document.createElement("canvas");
            canvas.width = 800;
            canvas.height = 400;
            const ctx = canvas.getContext("2d");

            const colors = [...colorInputsDiv.querySelectorAll("input")]
                .map(input => input.value);

            if (colors.length < 2) {
                alert("Se necesitan al menos 2 colores.");
                return;
            }

            let gradient;

            if (gradientType.value === "linear") {

                // 🎯 Convertimos ángulo a radianes
                const angle = (parseInt(angleInput.value) || 90) * Math.PI / 180;

                // 🎯 Calculamos dirección basada en ángulo
                const x = Math.cos(angle) * canvas.width;
                const y = Math.sin(angle) * canvas.height;

                // 🎯 Creamos gradiente dinámico
                gradient = ctx.createLinearGradient(
                    canvas.width / 2 - x / 2,
                    canvas.height / 2 - y / 2,
                    canvas.width / 2 + x / 2,
                    canvas.height / 2 + y / 2
                );

            } else {

                // 🎯 Gradiente radial centrado
                gradient = ctx.createRadialGradient(
                    canvas.width / 2,
                    canvas.height / 2,
                    0,
                    canvas.width / 2,
                    canvas.height / 2,
                    canvas.width / 2
                );
            }

            // 🎯 Agregamos los color stops correctamente
            colors.forEach((color, index) => {
                gradient.addColorStop(index / (colors.length - 1), color);
            });

            ctx.fillStyle = gradient;
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            const link = document.createElement("a");
            link.download = "gradient.png";
            link.href = canvas.toDataURL("image/png");
            link.click();
        });

        // 🎯 Generar color aleatorio
        function getRandomColor() {
            return "#" + Math.floor(Math.random() * 16777215).toString(16).padStart(6, '0');
        }

        // Eventos adicionales
        gradientType.addEventListener("change", updateGradient);
        angleInput.addEventListener("input", updateGradient);

        // Inicializar
        generateColorsBtn.click();
        function hslToHex(h, s, l) {

            s /= 100;
            l /= 100;

            const k = n => (n + h / 30) % 12;
            const a = s * Math.min(l, 1 - l);

            const f = n =>
                l - a * Math.max(-1, Math.min(k(n) - 3,
                    Math.min(9 - k(n), 1)));

            const toHex = x =>
                Math.round(x * 255).toString(16).padStart(2, "0");

            return `#${toHex(f(0))}${toHex(f(8))}${toHex(f(4))}`;
        }

        function generateHarmony(baseColor, type, count) {

            const base = hexToHSL(baseColor);
            const colors = [];

            for (let i = 0; i < count; i++) {

                let hue = base.h;

                if (type === "analogous") {
                    hue = (base.h + (i * 30)) % 360;
                }

                if (type === "complementary") {
                    hue = i % 2 === 0 ? base.h : (base.h + 180) % 360;
                }

                if (type === "triadic") {
                    hue = (base.h + (i * 120)) % 360;
                }

                if (type === "mono") {
                    colors.push(
                        hslToHex(base.h, base.s, Math.max(10, base.l - i * 10)
                        )
                    );
                    continue;
                }

                colors.push(
                    hslToHex(hue, base.s, base.l)
                );
            }

            return colors;
        }
        const harmonySelect = document.getElementById("harmonyType");

        harmonySelect.addEventListener("change", () => {

            const inputs = colorInputsDiv.querySelectorAll("input");
            if (!inputs.length) return;

            const baseColor = inputs[0].value;
            const count = parseInt(colorCountInput.value);

            if (harmonySelect.value === "custom") return;

            const harmonyColors = generateHarmony(
                baseColor,
                harmonySelect.value,
                count
            );

            // Reemplazar colores generados
            inputs.forEach((input, index) => {
                input.value = harmonyColors[index];
            });

            updateGradient();
        });



        // 📁 Cargar imagen
        imageInput.addEventListener("change", (e) => {

            const file = e.target.files[0];

            if (!file) {
                alert("Selecciona una imagen válida.");
                return;
            }

            const reader = new FileReader();

            reader.onload = function (event) {
                originalImage.src = event.target.result;
                previewImage.src = event.target.result;
            };

            reader.readAsDataURL(file);
        });

    </script>
</body>

</html>
