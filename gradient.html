<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Generador de Gradientes</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #121212;
            color: #e0e0e0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            width: 100%;
            background: #1e1e1e;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.7);
        }

        header {
            background: #252525;
            padding: 20px;
            text-align: center;
            border-bottom: 1px solid #333;
        }

        h1 {
            font-size: 2.2rem;
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
        }

        h1 span {
            color: #4CAF50;
        }

        nav {
            display: flex;
            justify-content: center;
            gap: 15px;
            padding: 15px 0;
            background: #252525;
            border-bottom: 1px solid #333;
        }

        nav a {
            color: #b0b0b0;
            text-decoration: none;
            padding: 8px 15px;
            border-radius: 8px;
            transition: all 0.3s;
            font-weight: 500;
        }

        nav a:hover,
        nav a.active {
            background: #2d2d2d;
            color: #4CAF50;
        }

        .content {
            display: flex;
            flex-direction: row;
            gap: 25px;
            padding: 25px;
            width: 100%;
        }

        .section {
            background: #252525;
            border-radius: 12px;
            padding: 20px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.3);
        }

        .section-title {
            font-size: 1.4rem;
            margin-bottom: 20px;
            color: #4CAF50;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .controls {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }

        @media (max-width: 768px) {
            .controls {
                grid-template-columns: 1fr;
            }

            .content {
                flex-direction: column;
            }
        }

        .control-group {
            margin-bottom: 15px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 500;
            color: #ccc;
        }

        input,
        select {
            width: 100%;
            padding: 12px;
            background: #333;
            border: 1px solid #444;
            border-radius: 8px;
            color: white;
            font-size: 1rem;
            transition: border-color 0.3s;
        }

        input:focus,
        select:focus {
            outline: none;
            border-color: #4CAF50;
        }

        input[type="color"] {
            height: 50px;
            padding: 0;
            cursor: pointer;
        }

        input[type="number"] {
            width: 100%;
        }

        .color-controls {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-top: 15px;
        }

        .color-row {
            display: flex;
            gap: 10px;
            align-items: center;
        }

        .color-preview {
            width: 40px;
            height: 40px;
            border-radius: 8px;
            border: 1px solid #444;
            flex-shrink: 0;
        }

        .color-input {
            flex: 1;
        }

        .preview {
            height: 200px;
            border-radius: 12px;
            margin: 20px 0;
            background: linear-gradient(45deg, #1e1e1e, #2d2d2d);
            box-shadow: inset 0 0 20px rgba(0, 0, 0, 0.5);
            overflow: hidden;
            position: relative;
        }

        .preview-container {
            position: relative;
            border-radius: 12px;
            overflow: hidden;
            height: 200px;
            background: #1a1a1a;
        }

        .preview-gradient {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
        }

        .actions {
            display: flex;
            gap: 15px;
            margin-top: 15px;
            flex-wrap: wrap;
        }

        button {
            flex: 1;
            min-width: 120px;
            padding: 14px;
            background: #4CAF50;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        button:hover {
            background: #45a049;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.3);
        }

        button:active {
            transform: translateY(0);
        }

        button.secondary {
            background: #555;
        }

        button.secondary:hover {
            background: #666;
        }

        .image-section {
            margin-top: 20px;
        }

        .image-controls {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }

        @media (max-width: 768px) {
            .image-controls {
                grid-template-columns: 1fr;
            }
        }

        .drop-zone {
            border: 2px dashed #4CAF50;
            padding: 30px;
            text-align: center;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.3s;
            background: #252525;
            min-height: 150px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            gap: 15px;
        }

        .drop-zone.dragover {
            background: #2d2d2d;
            border-color: #81c784;
        }

        .drop-zone p {
            margin: 0;
            opacity: 0.8;
            font-size: 1.1rem;
        }

        .drop-zone i {
            font-size: 2.5rem;
            color: #4CAF50;
        }

        .image-preview-wrapper {
            display: flex;
            gap: 20px;
            margin-top: 25px;
            flex-wrap: wrap;
        }

        .image-box {
            position: relative;
            width: 100%;
            height: 300px;
            background: #222;
            border-radius: 12px;
            overflow: hidden;
            flex: 1;
            min-width: 300px;
        }

        .image-box img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: none;
        }

        .image-box.active img {
            display: block;
        }

        .gradient-box {
            position: relative;
        }

        #gradientOverlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            opacity: 0.5;
            mix-blend-mode: overlay;
        }

        .image-options {
            display: flex;
            gap: 15px;
            margin-top: 20px;
            flex-wrap: wrap;
        }

        .option-group {
            flex: 1;
            min-width: 200px;
        }

        .slider-container {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .slider-value {
            min-width: 40px;
            text-align: right;
            font-weight: 600;
            color: #4CAF50;
        }

        .instructions {
            background: #252525;
            border-radius: 12px;
            padding: 20px;
            margin-top: 20px;
        }

        .instructions h3 {
            color: #4CAF50;
            margin-bottom: 15px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .instructions ul {
            padding-left: 25px;
        }

        .instructions li {
            margin-bottom: 10px;
            line-height: 1.5;
        }

        .footer {
            text-align: center;
            padding: 20px;
            color: #777;
            font-size: 0.9rem;
            border-top: 1px solid #333;
        }

        .status {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 0.9rem;
            margin-top: 10px;
            color: #aaa;
        }

        .status.active {
            color: #4CAF50;
        }

        .status i {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: #555;
        }

        .status.active i {
            background: #4CAF50;
        }

        .harmony-controls {
            display: flex;
            gap: 10px;
            margin-top: 15px;
        }

        .harmony-btn {
            flex: 1;
            padding: 10px;
            background: #333;
            border: 1px solid #444;
            border-radius: 8px;
            color: #ccc;
            cursor: pointer;
            transition: all 0.3s;
        }

        .harmony-btn.active,
        .harmony-btn:hover {
            background: #4CAF50;
            color: white;
        }

        .tooltip {
            position: relative;
            display: inline-block;
        }

        .tooltip .tooltiptext {
            visibility: hidden;
            width: 200px;
            background: #333;
            color: #fff;
            text-align: center;
            border-radius: 6px;
            padding: 10px;
            position: absolute;
            z-index: 1;
            bottom: 125%;
            left: 50%;
            margin-left: -100px;
            opacity: 0;
            transition: opacity 0.3s;
            font-size: 0.9rem;
            line-height: 1.4;
        }

        .tooltip:hover .tooltiptext {
            visibility: visible;
            opacity: 1;
        }

        .tooltip .tooltiptext::after {
            content: "";
            position: absolute;
            top: 100%;
            left: 50%;
            margin-left: -5px;
            border-width: 5px;
            border-style: solid;
            border-color: #333 transparent transparent transparent;
        }

        .hidden {
            display: none;
        }

        .success-message {
            background: rgba(76, 175, 80, 0.2);
            border-left: 4px solid #4CAF50;
            padding: 15px;
            border-radius: 8px;
            margin-top: 20px;
            display: none;
        }

        .success-message.show {
            display: block;
            animation: fadeIn 0.5s;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(-10px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
    </style>
</head>

<body>
    <div class="container">
        <header>
            <nav>
                <a href="index.html">Color generation</a>
                <a href="image.html">Generate color from image</a>
            </nav>
            <h1><span>🎨</span> Generador de Gradientes</h1>

        </header>

        <div class="content">
            <div class="section">
                <h2 class="section-title">Configuración del Gradiente</h2>

                <div class="controls">
                    <div class="control-group">
                        <label>Tipo de Gradiente:</label>
                        <select id="gradientType">
                            <option value="linear">Linear</option>
                            <option value="radial">Radial</option>
                        </select>
                    </div>

                    <div class="control-group">
                        <label>Ángulo (solo linear):</label>
                        <input type="number" id="angle" min="0" max="360" value="90">
                    </div>

                    <div class="control-group">
                        <label>Cantidad de Colores:</label>
                        <input type="number" id="colorCount" min="2" max="6" value="2">
                    </div>

                    <div class="control-group">
                        <label>Tipo de Armonía:</label>
                        <select id="harmonyType">
                            <option value="custom">Personalizado</option>
                            <option value="mono">Monocromática</option>
                            <option value="analogous">Análoga</option>
                            <option value="complementary">Complementaria</option>
                            <option value="triadic">Triádica</option>
                        </select>
                    </div>
                </div>

                <div class="harmony-controls">
                    <button class="harmony-btn active" data-type="custom">Personalizado</button>
                    <button class="harmony-btn" data-type="mono">Monocromática</button>
                    <button class="harmony-btn" data-type="analogous">Análoga</button>
                    <button class="harmony-btn" data-type="complementary">Complementaria</button>
                    <button class="harmony-btn" data-type="triadic">Triádica</button>
                </div>

                <div class="control-group">
                    <label>Colores del Gradiente:</label>
                    <div id="colorInputs" class="color-controls">
                        <!-- Color inputs will be generated here -->
                    </div>
                </div>

                <button id="generateColors" class="secondary">
                    <span>🔄</span> Generar Colores
                </button>

                <div class="preview-container">
                    <div id="preview" class="preview-gradient"></div>
                </div>

                <div class="actions">
                    <button id="downloadImage">
                        <span>🖼️</span> Exportar Gradiente
                    </button>
                    <button id="downloadPreview">
                        <span>✅</span> Descargar Preview
                    </button>
                </div>

                <div class="success-message" id="successMessage">
                    ¡Exportación exitosa! Tu imagen se ha descargado correctamente.
                </div>
            </div>

            <div class="section image-section">
                <h2 class="section-title">Aplicar a Imagen</h2>

                <div class="image-controls">
                    <div class="control-group">
                        <label>Cargar Imagen:</label>
                        <div id="dropZone" class="drop-zone">
                            <i>📁</i>
                            <p>Arrastra tu imagen aquí o haz clic</p>
                            <input type="file" id="imageInput" accept="image/*" hidden>
                        </div>
                    </div>

                    <div class="control-group">
                        <label>Opacidad del Gradiente:</label>
                        <div class="slider-container">
                            <input type="range" id="overlayOpacity" min="0" max="1" step="0.05" value="0.5">
                            <span class="slider-value">50%</span>
                        </div>
                    </div>

                    <div class="control-group">
                        <label>Modo de Mezcla:</label>
                        <select id="blendMode">
                            <option value="normal">Normal</option>
                            <option value="multiply">Multiply</option>
                            <option value="overlay">Overlay</option>
                            <option value="screen">Screen</option>
                            <option value="soft-light">Soft Light</option>
                        </select>
                    </div>
                </div>

                <div class="image-preview-wrapper">
                    <div class="image-box" id="originalBox">
                        <img id="originalImage">
                        <div class="status">
                            <i></i> Imagen original
                        </div>
                    </div>

                    <div class="image-box gradient-box" id="exportTarget">
                        <img id="previewImage">
                        <div id="gradientOverlay"></div>
                        <div class="status active">
                            <i></i> Preview con gradiente
                        </div>
                    </div>
                </div>

                <!-- <div class="actions">
                    <button id="applyGradient">
                        <span>⚙️</span> Aplicar Gradiente
                    </button>
                    <button id="resetImage">
                        <span>↩️</span> Restablecer
                    </button>
                </div> -->
            </div>


        </div>

    </div>

    <script>
        // DOM Elements
        const gradientType = document.getElementById("gradientType");
        const angleInput = document.getElementById("angle");
        const colorCountInput = document.getElementById("colorCount");
        const generateColorsBtn = document.getElementById("generateColors");
        const colorInputsDiv = document.getElementById("colorInputs");
        const preview = document.getElementById("preview");
        const imageInput = document.getElementById("imageInput");
        const originalImage = document.getElementById("originalImage");
        const previewImage = document.getElementById("previewImage");
        const gradientOverlay = document.getElementById("gradientOverlay");
        const overlayOpacity = document.getElementById("overlayOpacity");
        const blendMode = document.getElementById("blendMode");
        const downloadImage = document.getElementById("downloadImage");
        const downloadPreview = document.getElementById("downloadPreview");
        const dropZone = document.getElementById("dropZone");
        // const applyGradientBtn = document.getElementById("applyGradient");
        // const resetImageBtn = document.getElementById("resetImage");
        const successMessage = document.getElementById("successMessage");
        const opacityValue = document.querySelector(".slider-value");
        const harmonyButtons = document.querySelectorAll(".harmony-btn");
        const harmonySelect = document.getElementById("harmonyType");

        // State
        let imageLoaded = false;
        let currentHarmony = "custom";

        // Initialize
        generateColorsBtn.click();

        // Event Listeners
        generateColorsBtn.addEventListener("click", generateColorInputs);
        gradientType.addEventListener("change", updateGradient);
        angleInput.addEventListener("input", updateGradient);
        overlayOpacity.addEventListener("input", updateGradient);
        blendMode.addEventListener("change", updateGradient);
        downloadImage.addEventListener("click", exportGradient);
        downloadPreview.addEventListener("click", exportPreview);
        // applyGradientBtn.addEventListener("click", applyGradient);
        // resetImageBtn.addEventListener("click", resetImage);

        // Harmony buttons
        harmonyButtons.forEach(btn => {
            btn.addEventListener("click", () => {
                harmonyButtons.forEach(b => b.classList.remove("active"));
                btn.classList.add("active");
                currentHarmony = btn.getAttribute("data-type");
                harmonySelect.value = currentHarmony;
                updateHarmony();
            });
        });

        // Image handling
        dropZone.addEventListener("click", () => {
            imageInput.click();
        });

        ["dragenter", "dragover", "dragleave", "drop"].forEach(eventName => {
            dropZone.addEventListener(eventName, e => e.preventDefault());
        });

        dropZone.addEventListener("dragover", () => {
            dropZone.classList.add("dragover");
        });

        dropZone.addEventListener("dragleave", () => {
            dropZone.classList.remove("dragover");
        });

        dropZone.addEventListener("drop", (e) => {
            dropZone.classList.remove("dragover");
            handleImage(e.dataTransfer.files[0]);
        });

        imageInput.addEventListener("change", (e) => {
            handleImage(e.target.files[0]);
        });

        // Update opacity value display
        overlayOpacity.addEventListener("input", () => {
            opacityValue.textContent = `${Math.round(overlayOpacity.value * 100)}%`;
            updateGradient();
        });

        // Functions
        function handleImage(file) {
            if (!file) return;

            // Validate file type
            if (!file.type.startsWith("image/")) {
                alert("El archivo debe ser una imagen.");
                return;
            }

            // Validate file size (5MB max)
            if (file.size > 5 * 1024 * 1024) {
                alert("La imagen es demasiado grande (máx 5MB).");
                return;
            }

            const reader = new FileReader();
            reader.onload = function (event) {
                originalImage.src = event.target.result;
                previewImage.src = event.target.result;
                imageLoaded = true;
                updateGradient();

                // Show image boxes
                document.getElementById("originalBox").classList.add("active");
                document.getElementById("exportTarget").classList.add("active");
            };
            reader.readAsDataURL(file);
        }

        function generateColorInputs() {
            const count = parseInt(colorCountInput.value);

            // Validate count
            if (isNaN(count) || count < 2) {
                alert("Debe haber al menos 2 colores.");
                colorCountInput.value = 2;
                return;
            }

            colorInputsDiv.innerHTML = "";

            for (let i = 0; i < count; i++) {
                const colorRow = document.createElement("div");
                colorRow.className = "color-row";

                const colorPreview = document.createElement("div");
                colorPreview.className = "color-preview";
                colorPreview.style.backgroundColor = getRandomColor();

                const colorInput = document.createElement("input");
                colorInput.className = "color-input";
                colorInput.type = "color";
                colorInput.value = colorPreview.style.backgroundColor;

                colorInput.addEventListener("input", () => {
                    colorPreview.style.backgroundColor = colorInput.value;
                    updateGradient();
                });

                colorRow.appendChild(colorPreview);
                colorRow.appendChild(colorInput);
                colorInputsDiv.appendChild(colorRow);
            }

            updateGradient();
        }

        function updateGradient() {
            const colorInputs = colorInputsDiv.querySelectorAll(".color-input");

            if (!colorInputs || colorInputs.length < 2) {
                preview.style.background = "#333";
                gradientOverlay.style.background = "none";
                return;
            }

            const colors = Array.from(colorInputs).map(input => input.value);
            let gradient = "";

            if (gradientType.value === "linear") {
                let angle = parseInt(angleInput.value);
                if (isNaN(angle)) angle = 90;
                angleInput.value = angle;
                gradient = `linear-gradient(${angle}deg, ${colors.join(", ")})`;
            } else {
                gradient = `radial-gradient(circle, ${colors.join(", ")})`;
            }

            preview.style.background = gradient;
            gradientOverlay.style.background = gradient;
            gradientOverlay.style.opacity = overlayOpacity.value;
            gradientOverlay.style.mixBlendMode = blendMode.value;

            // Apply to canvas preview if image is loaded
            if (imageLoaded) {
                applyGradient();
            }
        }

        function updateHarmony() {
            const inputs = colorInputsDiv.querySelectorAll(".color-input");
            if (!inputs.length) return;

            const baseColor = inputs[0].value;
            const count = parseInt(colorCountInput.value);

            if (currentHarmony === "custom") return;

            const harmonyColors = generateHarmony(baseColor, currentHarmony, count);

            // Update color inputs
            harmonyColors.forEach((color, index) => {
                if (inputs[index]) {
                    inputs[index].value = color;
                    inputs[index].previousElementSibling.style.backgroundColor = color;
                }
            });

            updateGradient();
        }

        function getRandomColor() {
            return "#" + Math.floor(Math.random() * 16777215).toString(16).padStart(6, '0');
        }

        function hexToHSL(hex) {
            // Expand shorthand form (e.g. "03F" to "0033FF")
            const shorthandRegex = /^#?([a-f\d])([a-f\d])([a-f\d])$/i;
            hex = hex.replace(shorthandRegex, (m, r, g, b) => r + r + g + g + b + b);

            const result = /^#?([a-f\d]{2})([a-f\d]{2})([a-f\d]{2})$/i.exec(hex);
            if (!result) return null;

            let r = parseInt(result[1], 16);
            let g = parseInt(result[2], 16);
            let b = parseInt(result[3], 16);

            r /= 255;
            g /= 255;
            b /= 255;

            const max = Math.max(r, g, b);
            const min = Math.min(r, g, b);
            let h, s, l = (max + min) / 2;

            if (max === min) {
                h = s = 0; // achromatic
            } else {
                const d = max - min;
                s = l > 0.5 ? d / (2 - max - min) : d / (max + min);
                switch (max) {
                    case r: h = (g - b) / d + (g < b ? 6 : 0); break;
                    case g: h = (b - r) / d + 2; break;
                    case b: h = (r - g) / d + 4; break;
                }
                h /= 6;
            }

            return {
                h: Math.round(h * 360),
                s: Math.round(s * 100),
                l: Math.round(l * 100)
            };
        }

        function hslToHex(h, s, l) {
            s /= 100;
            l /= 100;

            const k = n => (n + h / 30) % 12;
            const a = s * Math.min(l, 1 - l);
            const f = n => l - a * Math.max(-1, Math.min(k(n) - 3, Math.min(9 - k(n), 1)));

            const toHex = x => {
                const val = Math.round(x * 255);
                return val.toString(16).padStart(2, '0');
            };

            return `#${toHex(f(0))}${toHex(f(8))}${toHex(f(4))}`;
        }

        function generateHarmony(baseColor, type, count) {
            const base = hexToHSL(baseColor);
            const colors = [];

            for (let i = 0; i < count; i++) {
                let hue = base.h;
                let saturation = base.s;
                let lightness = base.l;

                switch (type) {
                    case "mono":
                        // Monochromatic: same hue, varying lightness
                        lightness = Math.max(10, Math.min(90, base.l - (i * 15)));
                        colors.push(hslToHex(hue, saturation, lightness));
                        break;

                    case "analogous":
                        // Analogous: adjacent hues on color wheel
                        hue = (base.h + (i * 30)) % 360;
                        colors.push(hslToHex(hue, saturation, lightness));
                        break;

                    case "complementary":
                        // Complementary: opposite color on wheel
                        hue = i % 2 === 0 ? base.h : (base.h + 180) % 360;
                        colors.push(hslToHex(hue, saturation, lightness));
                        break;

                    case "triadic":
                        // Triadic: 120° apart
                        hue = (base.h + (i * 120)) % 360;
                        colors.push(hslToHex(hue, saturation, lightness));
                        break;
                }
            }

            return colors;
        }

        function applyGradient() {
            if (!imageLoaded) {
                alert("Carga una imagen primero.");
                return;
            }

            // This is just a visual update - the gradient is already applied via CSS
            // We're triggering a re-render to ensure proper display
            gradientOverlay.style.opacity = gradientOverlay.style.opacity;
        }

        function resetImage() {
            originalImage.src = "";
            previewImage.src = "";
            imageLoaded = false;
            document.getElementById("originalBox").classList.remove("active");
            document.getElementById("exportTarget").classList.remove("active");
            gradientOverlay.style.background = "none";
        }

        function exportGradient() {
            const canvas = document.createElement("canvas");
            canvas.width = 800;
            canvas.height = 400;
            const ctx = canvas.getContext("2d");

            const colors = Array.from(colorInputsDiv.querySelectorAll(".color-input"))
                .map(input => input.value);

            if (colors.length < 2) {
                alert("Se necesitan al menos 2 colores.");
                return;
            }

            // Create gradient on canvas
            let gradient;
            const centerX = canvas.width / 2;
            const centerY = canvas.height / 2;

            if (gradientType.value === "linear") {
                const angle = (parseInt(angleInput.value) || 90) * Math.PI / 180;
                const length = 1000; // Fixed length for consistent gradient
                const startX = centerX - Math.cos(angle) * length;
                const startY = centerY - Math.sin(angle) * length;
                const endX = centerX + Math.cos(angle) * length;
                const endY = centerY + Math.sin(angle) * length;

                gradient = ctx.createLinearGradient(startX, startY, endX, endY);
            } else {
                // Radial gradient with proper sizing
                const radius = Math.max(canvas.width, canvas.height) * 0.7;
                gradient = ctx.createRadialGradient(
                    centerX, centerY, 0,
                    centerX, centerY, radius
                );
            }

            // Add color stops
            colors.forEach((color, index) => {
                gradient.addColorStop(index / (colors.length - 1), color);
            });

            ctx.fillStyle = gradient;
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Export as PNG
            const link = document.createElement("a");
            link.download = "gradient.png";
            link.href = canvas.toDataURL("image/png");
            link.click();

            // Show success message
            successMessage.classList.add("show");
            setTimeout(() => {
                successMessage.classList.remove("show");
            }, 3000);
        }

        function exportPreview() {
            if (!imageLoaded) {
                alert("Carga una imagen primero.");
                return;
            }

            const img = new Image();
            img.crossOrigin = "anonymous";
            img.src = previewImage.src;

            img.onload = async function () {
                try {
                    // Create canvas with image dimensions
                    const canvas = document.createElement("canvas");
                    canvas.width = img.naturalWidth;
                    canvas.height = img.naturalHeight;
                    const ctx = canvas.getContext("2d");

                    // Draw base image with smoothing
                    ctx.imageSmoothingEnabled = true;
                    ctx.drawImage(img, 0, 0);

                    // Get colors
                    const colors = Array.from(colorInputsDiv.querySelectorAll(".color-input"))
                        .map(input => input.value);

                    if (colors.length < 2) {
                        alert("Necesitas ≥2 colores");
                        return;
                    }

                    // Create gradient
                    const centerX = canvas.width / 2;
                    const centerY = canvas.height / 2;
                    let gradient;

                    if (gradientType.value === "linear") {
                        const angle = (parseInt(angleInput.value) || 90) * Math.PI / 180;
                        const length = 1000; // Fixed length for consistent gradient
                        const startX = centerX - Math.cos(angle) * length;
                        const startY = centerY - Math.sin(angle) * length;
                        const endX = centerX + Math.cos(angle) * length;
                        const endY = centerY + Math.sin(angle) * length;

                        gradient = ctx.createLinearGradient(startX, startY, endX, endY);
                    } else {
                        const radius = Math.max(canvas.width, canvas.height) * 0.7;
                        gradient = ctx.createRadialGradient(
                            centerX, centerY, 0,
                            centerX, centerY, radius
                        );
                    }

                    // Add color stops
                    colors.forEach((color, index) => {
                        gradient.addColorStop(index / (colors.length - 1), color);
                    });

                    // Apply gradient with proper blending
                    const blendMap = {
                        "normal": "source-over",
                        "multiply": "multiply",
                        "overlay": "overlay",
                        "screen": "screen",
                        "soft-light": "soft-light"
                    };

                    ctx.globalAlpha = parseFloat(overlayOpacity.value);
                    ctx.globalCompositeOperation = blendMap[blendMode.value] || "source-over";

                    // Draw gradient with no smoothing for crisp edges
                    ctx.imageSmoothingEnabled = false;
                    ctx.fillStyle = gradient;
                    ctx.fillRect(0, 0, canvas.width, canvas.height);

                    // Reset canvas state
                    ctx.globalAlpha = 1;
                    ctx.globalCompositeOperation = "source-over";
                    ctx.imageSmoothingEnabled = true;

                    // Export as PNG
                    const link = document.createElement("a");
                    link.download = "preview-gradient.png";
                    link.href = canvas.toDataURL("image/png", 1.0);
                    link.click();

                    // Show success message
                    successMessage.classList.add("show");
                    setTimeout(() => {
                        successMessage.classList.remove("show");
                    }, 3000);
                } catch (error) {
                    console.error("Error exporting preview:", error);
                    alert("Error al exportar la imagen. Intenta con otra imagen.");
                }
            };
        }

        // Initialize harmony selection
        harmonySelect.addEventListener("change", () => {
            currentHarmony = harmonySelect.value;
            harmonyButtons.forEach(btn => {
                btn.classList.remove("active");
                if (btn.getAttribute("data-type") === currentHarmony) {
                    btn.classList.add("active");
                }
            });
            updateHarmony();
        });

        // Initial setup
        function init() {
            // Set initial harmony
            currentHarmony = harmonySelect.value;
            harmonyButtons.forEach(btn => {
                btn.classList.remove("active");
                if (btn.getAttribute("data-type") === currentHarmony) {
                    btn.classList.add("active");
                }
            });

            // Generate initial colors
            generateColorInputs();
        }

        // Initialize the app
        document.addEventListener("DOMContentLoaded", init);
    </script>
